<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    {% include nav.html %}

    {% if page.toc==true %}
      <aside class="toc">
        {% include toc.html html=content h_max=3%}
      </aside>
    {% endif %}

    <div id="main" role="main" class="wrapper-content">
      <div class="container">
        {{ content }}
      </div>
    </div>

    {% include analytics.html %}
    <script defer>
      document.addEventListener("DOMContentLoaded", function () {
        var images = document.querySelectorAll(".entry img");
        for (var i = 0; i < images.length; i++) {
          if (!images[i].hasAttribute("loading")) images[i].setAttribute("loading", "lazy");
          if (!images[i].hasAttribute("decoding")) images[i].setAttribute("decoding", "async");
        }
      });
    </script>
  </body>

  {% if page.toc==true %}
  <script>
    document.getElementById("main").classList.add("withtoc");
  </script>
  {% endif %}

  <div class="wrapper-footer-mobile">
    <footer class="footer">
      {% include footer.html %}
    </footer>


</html>
